# Formatting, types and unit tests, the extension against AMO's rules, the
# library's PHP on old and new PHP, and the E2E tests against the Phorge of
# dev/phorge, as they run locally (README.md).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Node of "engines", and a current one.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the build numbers itself by its commits (scripts/version.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Lint the extension
        env:
          PHLAIR_HOSTS: https://phorge.example.com/*
          PHLAIR_GECKO_ID: ci@example.com
        run: node build.mjs --extension && npx web-ext lint --self-hosted

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Syntax of the library
        run: find phorge -name '*.php' -print0 | xargs -0 -n1 php -l

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox chromium
      # Browsers and curl know that *.localhost is this machine, Node does not.
      - run: echo "127.0.0.1 phorge.localhost" | sudo tee -a /etc/hosts
      # The library's script, which the container loads, before it starts.
      - run: npm run build:dev
      - name: Start Phorge
        working-directory: dev/phorge
        run: |
          docker compose up -d --build
          # Apache starts once the database is set up and seed.php has run.
          timeout 600 sh -c 'until curl -sf -o /dev/null http://phorge.localhost:8098/; do sleep 2; done'
      - run: npm run e2e
      - name: Logs of Phorge
        if: failure()
        working-directory: dev/phorge
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
