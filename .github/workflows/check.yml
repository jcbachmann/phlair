# Formatting, types and unit tests, the extension against AMO's rules, the
# library's PHP on old and new PHP, OneDriphe on Windows and Linux, and the E2E tests
# against the Phorge of dev/phorge, as they run locally (docs/DEVELOPMENT.md).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Node of "engines", and a current one.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the build numbers itself by its commits (scripts/version.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Lint the extension
        env:
          PHLAIR_HOSTS: https://phorge.example.com/*
          PHLAIR_GECKO_ID: ci@example.com
        run: node build.mjs --extension && npx web-ext lint --self-hosted

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The PHP of production (Debian 13) and of the dev instance (dev/phorge).
        php: ["8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Syntax of the library
        run: find phorge -name '*.php' -print0 | xargs -0 -n1 php -l

  # OneDriphe (phorge/onedriphe) in Windows PowerShell 5.1 on Windows itself:
  # its tests, and installing and removing it (as administrator).
  onedriphe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        shell: powershell
        run: ./phorge/onedriphe/onedriphe.tests.ps1
      - name: Installing and removing
        shell: powershell
        run: ./phorge/onedriphe/windows.tests.ps1
      - name: Compatible with Windows PowerShell 5.1
        shell: pwsh
        run: ./phorge/onedriphe/compatibility.ps1

  # OneDriphe for Linux (phorge/onedriphe/onedriphe.py): its tests, also of
  # installing and removing it, on the runner's Python 3, and shellcheck on the
  # installer (in its image: the runner's Ubuntu may not have it).
  onedriphe-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: npm run test:linux
      - name: Installer
        run: docker run --rm -v "$PWD/phorge/onedriphe:/w:ro" koalaman/shellcheck:v0.10.0 /w/install.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox chromium
      # Browsers and curl know that *.localhost is this machine, Node does not.
      - run: echo "127.0.0.1 phorge.localhost files.localhost" | sudo tee -a /etc/hosts
      # The library's script, which the container loads, before it starts.
      - run: npm run build:dev
      - name: Start Phorge
        working-directory: dev/phorge
        run: |
          docker compose up -d --build
          # Apache starts once the database is set up and seed.php has run.
          timeout 600 sh -c 'until curl -sf -o /dev/null http://phorge.localhost:8098/; do sleep 2; done'
      - run: npm run e2e
      - name: Logs of Phorge
        if: failure()
        working-directory: dev/phorge
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
