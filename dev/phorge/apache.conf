<VirtualHost *:80>
  DocumentRoot /srv/phorge/webroot
  # The built editor, for loading it into pages during development.
  Alias /rme-dev/ /opt/remarkup-editor-dist/
  <Directory /opt/remarkup-editor-dist>
    Require all granted
    Header set Cache-Control no-store
  </Directory>
  RewriteEngine on
  RewriteCond %{REQUEST_URI} !^/rme-dev/
  RewriteRule ^(.*)$ /index.php?__path__=$1 [B,L,QSA]
  <Directory /srv/phorge/webroot>
    Require all granted
  </Directory>
</VirtualHost>
