<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phlair</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 12px;
        min-width: 320px;
      }
      label {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 8px;
        margin-bottom: 12px;
      }
      label span {
        grid-column: 2;
        opacity: 0.7;
      }
      p {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <form id="tools"></form>
    <p>Changes apply to pages opened afterwards.</p>
    <script src="options.js"></script>
  </body>
</html>
